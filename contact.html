<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header>
      <h1>Contact Page</h1>
    </header>
    <section>
      <form action="" method="POST">
        <div class = "form-group">
          <label for="full_name">Full Name: </label>
          <input type="text" id="full_name"  name="full_name">
        </div>
        <div class = "form-group">
          <label for="email">Email: </label>
          <input type="email" id="email" name="email">
        </div>
        <div class = "form-group">
          <label for="phone">Phone Number: </label>
          <input type="text" id="phone" name="phone">
        </div>
        <div class = "form-group">
          <label for="subject">Subject: </label>
          <select id="subject" name="subject">
            <option value="gen_enquiry">General Enquiry</option>
            <option value="qoute">Get a qoute</option>
            <option value="booking">Book a service</option>
            <option value="support">Support</option>
            <option value="partners">Becoming a Partner</option>
            <option value="careers">Joining our team</option>
          </select>
        </div>
        <div class = "form-group">
          <label for="message">Message: </label>
          <input type="text" id="message" name="message">
        </div>
        <div>
        <button type="Submit">Add Details</button>
        </div>
      </form>
    </section>
    <article>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Day & Time</th>
              <th>10:00</th>
              <th>13:00</th>
              <th>16:00</th>
            </tr>
          </thead>
          <tbody>

              <td>Monday</td>

            <tr>
              <td>Tuesday</td>

            </tr>
            <tr>
              <td>Wednesday</td>

            </tr>
            <tr>

              <td><a href="">Book</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </article>
  </body>
